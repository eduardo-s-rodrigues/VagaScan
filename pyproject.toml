[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vagasscan"
version = "0.1.0"
description = "MVP para busca, análise e acompanhamento de vagas de tecnologia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
vagasscan = "vagasscan.main:main"

[tool.setuptools.packages.find]
include = ["vagasscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

