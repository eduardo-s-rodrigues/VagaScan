{% extends "base.html" %}
{% block title %}Cadastrar vaga — VagaScan{% endblock %}
{% block content %}<section class="page-header"><div class="container"><p class="eyebrow">ÁREA PRIVADA</p><h1>Cadastrar vaga manualmente</h1></div></section><section class="section"><div class="container narrow"><form class="form-card" method="post" action="/dashboard/vagas/nova"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}<div class="form-grid"><div class="field"><label for="titulo">Título</label><input id="titulo" name="titulo" maxlength="200" required value="{{ values.titulo or '' }}"></div><div class="field"><label for="empresa">Empresa</label><input id="empresa" name="empresa" maxlength="200" value="{{ values.empresa or '' }}"></div><div class="field"><label for="localizacao">Localização</label><input id="localizacao" name="localizacao" maxlength="200" value="{{ values.localizacao or '' }}"></div><div class="field"><label for="modalidade">Modalidade</label><input id="modalidade" name="modalidade" maxlength="100" value="{{ values.modalidade or '' }}"></div><div class="field"><label for="nivel">Nível</label><input id="nivel" name="nivel" maxlength="100" value="{{ values.nivel or '' }}"></div><div class="field"><label for="link">Link HTTP(S)</label><input id="link" name="link" maxlength="2048" value="{{ values.link or '' }}"></div><div class="field field-wide"><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" maxlength="20000" rows="12" required>{{ values.descricao or '' }}</textarea></div></div><button class="button" type="submit">Salvar e analisar</button></form></div></section>{% endblock %}
